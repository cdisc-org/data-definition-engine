# ─────────────────────────────────────────────────────────────────────────────
# Mock LZZT DTA instance — validates against dta.linkml.yaml (root: Transmission)
#
# Rewritten for schema v0.2.0: the payload is now a flat TransferRecord list
# (DTA MVP Inventory / Data_Structure), replacing the v0.1.0 nested LAB v2 graph.
#
# Clinical values are carried over from the project's real generated output
# (out/dta/lab_dta.csv), study H2Q-MC-LZZT (the CDISC LZZT pilot). Two analytes:
#   * HGB — agreed in the DTA test specification (joins on lbpanel + ctestcd)
#   * RBC — intentionally NOT in the agreed test specification, to exercise the
#           "received a test nobody agreed to" case the gap report surfaces.
#
# NOTE — facts the v0.1.0 payload carried that this structure cannot:
#   * conventional / SI results and units (old CVU*/SIU* blocks). Data_Structure
#     carries original result only (lborres/lborresu); the standardised result is
#     now DERIVED downstream using TestSpecification.conventional_unit / .si_unit.
#   * reference ranges (old PLRRLO/PLRRHI/PLRRRD). Data_Structure has no
#     LBORNRLO/LBORNRHI/LBNRIND equivalent — see the schema's `known_gap`.
#
# Validate:
#   linkml-validate -s dta.linkml.yaml -C Transmission transmission_minimal.example.yaml
# ─────────────────────────────────────────────────────────────────────────────

# ── file header ──
transfer_structure_version: DTA-MVP-1.0
igvrsn: SDTMIG 3.4
fcrdtc: "2025-01-01T00:00:00"
trssid: CENTRALLAB-001
trstyp: I
dta_version_ref: "1.0"          # -> DataTransferAgreement.dta_version.version_number

records:

  # ── Hemoglobin: agreed in the test specification ──
  - studyid: H2Q-MC-LZZT
    domain: LB
    usubjid: STUDY-0001
    subjid: SCR-0001
    lbgrpid: ACC-0001-V1          # accession / collection event
    lbrefid: SPEC-0001-V1-1       # specimen id
    lbtestcd: HGB
    lbtest: Hemoglobin
    lbcat: HEMATOLOGY
    lborres: "16.98"
    lborresu: g/dL
    lbstat: ""                    # null => a result was produced
    lbnam: Central Laboratory Services
    lbspec: BLOOD
    lbmethod: HPLC
    visitnum: 1
    visit: E1
    lbdtc: "2025-01-02"
    lbpanel: HEMATOLOGY           # ─┐ natural key to TestSpecification
    ctestcd: HGB                  # ─┘
    ctest: Hemoglobin
    cunit: g/dL
    cspec: BLOOD
    cpanel: HEMATOLOGY

  # ── Erythrocytes: NOT in the agreed test specification (gap case) ──
  - studyid: H2Q-MC-LZZT
    domain: LB
    usubjid: STUDY-0001
    subjid: SCR-0001
    lbgrpid: ACC-0001-V1
    lbrefid: SPEC-0001-V1-1
    lbtestcd: RBC
    lbtest: Erythrocytes
    lbcat: HEMATOLOGY
    lborres: "5.29"
    lborresu: "10^6/uL"
    lbnam: Central Laboratory Services
    lbspec: BLOOD
    visitnum: 1
    visit: E1
    lbdtc: "2025-01-02"
    lbpanel: HEMATOLOGY
    ctestcd: RBC                  # no matching TestSpecification row
    ctest: Erythrocytes
    cunit: "10^6/uL"
    cspec: BLOOD
    cpanel: HEMATOLOGY
