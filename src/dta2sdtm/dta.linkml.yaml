  dta_status:
    description: Document status for this version.
  environments:
    range: TransferEnvironmentSettings
    multivalued: true
    inlined_as_list: true
  provider_study_identifiers:
    multivalued: true
    description: Provider-scoped identifier(s) for this study.
    annotations:
      usdm_mapping_note: study.versions.studyIdentifiers.text + study.studyIdentifiers.scopeId = id of provider
        organization.
      mapping_status: direct
      mapping_cell: DTA_Attributes!M5
      usdm_property: study.versions.studyIdentifiers.text + study.studyIdentifiers.scopeId = id of provider organization.
  service_provider_identifiers:
    multivalued: true
    description: Provider-scoped identifier(s) for this study.
    annotations:
      usdm_mapping_note: study.versions.organizations.label (stores the name + other organization details can be
        stored as well in the same class)
      mapping_status: 'review: organization label is not an identifier'
      mapping_cell: DTA_Attributes!M6
  phone_number:
    description: Optional contact number; no standard USDM source asserted.
    annotations:
      usdm_mapping_note: Is valuable to add to USDM AssignedPerson class
      mapping_status: proposed extension
      mapping_cell: DTA_Attributes!M17
  variable_data_type:
    description: Declared format (text, numeric, datetime).
  source_record_identifier:
    description: Variable-level identifier designation from the inventory.
  visit_identifier:
    description: Variable-level identifier designation from the inventory.
  suggested_controls:
    range: SuggestedControls
    inlined: true
  constraints:
    multivalued: true
    description: 'A DTA carries several rules, each written for that DTA. Change to M:N if rules come from a reusable
      sponsor library. Review flag: from this row down, Descriptions look shifted up by one row (e.g., ''Sample/test
      generation logic'' fits Data Generation Rules).'
    annotations:
      status: suggested
      inventory_row: 39
      relationship: DTA → Rule
      cardinality: 1:N
  data_generation_rules:
    multivalued: true
    description: Several test-data generation rules per DTA (per data type, per scenario), each specific to that
      DTA.
    annotations:
      status: suggested
      inventory_row: 40
      relationship: DTA → Data Generation Rule
      cardinality: 1:N
  exception_handling:
    multivalued: true
    description: Several exception cases per DTA (missing data, failed tests, unscheduled visits), each specific
      to that DTA.
    annotations:
      status: suggested
      inventory_row: 41
      relationship: DTA → Exception Rule
      cardinality: 1:N
  transformations:
    multivalued: true
    description: Several vendor-specific transformations per DTA; they are tied to that vendor's source format,
      so not shared.
    annotations:
      status: suggested
      inventory_row: 42
      relationship: DTA → Transformation
      cardinality: 1:N
  vendor_qc:
    multivalued: true
    description: Several pre-transfer checks per DTA, defined against this DTA's specification.
    annotations:
      status: suggested
      inventory_row: 43
      relationship: DTA → Vendor QC Check
      cardinality: 1:N
  conformance_rule_refs:
    multivalued: true
    description: 'Conformance rules are typically a shared library (e.g., CDISC CORE or a sponsor standard check
      set): each DTA references many rules and each rule applies to many DTAs.'
    annotations:
      status: suggested
      inventory_row: 44
      relationship: DTA ↔ Conformance Rule
      cardinality: M:N
    range: uriorcurie
  reconciliation:
    multivalued: true
    description: Several reconciliations per DTA (e.g., sample counts vs. EDC, subject lists, visit dates), each
      specific to that DTA.
    annotations:
      status: suggested
      inventory_row: 45
      relationship: DTA → Reconciliation Specification
      cardinality: 1:N
  issue_loop:
    multivalued: false
    description: 'One agreed feedback and re-transfer process per DTA. Review flag: Description is blank.'
    annotations:
      status: suggested
      inventory_row: 46
      relationship: DTA → Issue Loop Process
      cardinality: '1:1'
  issue_resolution_timelines:
    multivalued: true
    description: At least two timelines per DTA (test transfer issues and production validation issues), per the
      description.
    annotations:
      status: suggested
      inventory_row: 47
      relationship: DTA → Resolution Timeline
      cardinality: 1:N
