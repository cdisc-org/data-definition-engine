      the DTA->SDTM transform uses to recover VISIT / VISITNUM, so a lossy round-trip here breaks visit derivation.'
    annotations:
      inventory_conflict: DTA_Attributes row 32 specifies Data Format = number; modelled as string for the reason
        above. Worth confirming with the workstream.
