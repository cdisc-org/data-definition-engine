enums:
  BcFacetGroupEnum:
    description: Facet dimension of a BiomedicalConcept classification row.
    permissible_values:
      category:
        description: Test grouping / panel membership (e.g. CBC, CMP, Lipid Panel).
      disease_area:
        description: Clinical / disease area the concept is relevant to.
      is_used_by_form:
        description: An EDC form that collects this concept.
      is_used_by_dta:
        description: A Data Transfer Agreement this concept is in scope for (BC->DTA edge).
  ProvenanceEnum:
    description: 'Field-level provenance: the KIND of source a value originated from, kept deliberately app-agnostic.
      "UI" denotes any human-facing data-entry interface (the specific application is recorded once at the agreement
      root via app_name, never here), so the vocabulary survives changes of UI tooling.'
    permissible_values:
      USDM:
        description: Auto-populated from the upstream USDM protocol.
      UI:
        description: Entered or edited by a human via a data-entry interface.
      USDM + UI:
        description: Prepopulated from USDM, then human-edited.
      Derived:
        description: Computed or defaulted by the agreement generator.
  OrganizationTypeEnum:
    description: Type of a party organization. Illustrative subset; extend as needed.
    permissible_values:
      Clinical Study Sponsor:
        description: Study sponsor organization.
      Manufacturer:
        description: Investigational product / device manufacturer.
      Laboratory:
        description: Performing / central laboratory.
      CRO:
        description: Contract research organization.
      Service Provider:
        description: Service provider (the GCP term used going forward).
  StudyRoleEnum:
    description: Role of an assigned person within their organization, per the DTA MVP Inventory (DTA_Attributes
      row 14, Signatures section). Maps to USDM AssignedPerson.jobTitle.
    permissible_values:
      Data Manager Primary:
        description: Primary data manager for the transfer.
      Data Manager Secondary:
        description: Secondary / backup data manager.
      Statistical Programmer:
        description: Statistical programmer.
      Vendor Lead:
        description: Lead contact at the data provider.
  DataExchangeRoleEnum:
    description: Direction of data exchange for a party.
    permissible_values:
      Data Provider:
        description: The party that sends the data (e.g. central lab).
      Data Recipient:
        description: The party that receives the data (e.g. sponsor).
  FileFormatEnum:
    description: Transferred file format.
    permissible_values:
      XPT:
        description: SAS Transport (XPORT) file.
      SAS 7bdat:
        description: SAS dataset (sas7bdat).
      CSV:
        description: Comma-separated values.
      Text:
        description: Delimited text.
      JSON:
        description: JSON.
      XLSX:
        description: Excel (OOXML).
      XLS:
        description: Excel (legacy).
      Parquet:
        description: Apache Parquet.
  EncodingEnum:
    description: Character encoding of the transferred file.
    permissible_values:
      UTF8:
        description: UTF-8.
      ASCII:
        description: US-ASCII.
  DelimiterEnum:
    description: Field delimiter (where applicable to the file format).
    permissible_values:
      Not Applicable:
        description: No delimiter (non-delimited format).
      Comma:
        description: Comma.
      Tab:
        description: Tab.
      Pipe:
        description: Pipe (|).
      Semicolon:
        description: Semicolon.
  TransmissionMethodEnum:
    description: Method by which the file is transmitted.
    permissible_values:
      sFTP:
        description: Secure FTP.
      Secure Portal:
        description: Web secure-transfer portal.
      API:
        description: Programmatic API transfer.
      Manual:
        description: Manual / out-of-band transfer.
  TransferModeEnum:
    description: Whether each transmission carries the full dataset or only changes since the last. Distinct from
      the file-level TransmissionTypeEnum (I/U/D).
    permissible_values:
      Cumulative:
        description: Each transfer contains the full cumulative dataset.
      Incremental:
        description: Each transfer contains only new/changed records.
  TransferEnvironmentEnum:
    description: Environment the transfer targets.
    permissible_values:
      Development:
        description: Development environment.
      Test:
        description: Test / validation environment.
      Production:
        description: Production environment.
  BlindingEnum:
    description: Blinding status of the transferred data.
    permissible_values:
      Blinded:
        description: Fully blinded transfer.
      Unblinded:
        description: Unblinded transfer.
      Partially blinded:
        description: Partially blinded transfer.
  TransmissionTypeEnum:
    description: File-level transmission type (LAB Tx TRSTYP). Subset; confirm against CDISC CT.
    permissible_values:
      I:
        description: Initial transmission.
      U:
        description: Update transmission.
      D:
        description: Delete transmission.
  UnitEnum:
    description: 'Unit of measure. Subset of CDISC CT codelist UNIT (C71620), source NCI EVS evs-2026-Q1. meaning
      CURIEs are NCIt C-codes. NOT bound to any slot: agreements legitimately use units outside this subset (mIU/L,
      ng/mL and pg/mL have all been observed in real transfers), and binding it would reject valid data. Referenced
      by the `recommended_codelist` annotation on the TestSpecification unit slots.'
    permissible_values:
      g/dL:
        description: Gram per Deciliter
        meaning: ncit:C64783
      g/L:
        description: Gram per Liter (EVS-mapped)
        meaning: ncit:C42576
      mg/dL:
        description: Milligram per Deciliter
        meaning: ncit:C67015
      10^6/uL:
        description: Million per Microliter (no EVS code in cache).
      10^12/L:
        description: 10^12 per Liter
        meaning: ncit:C67308
      10^9/L:
        description: Billion per Liter
        meaning: ncit:C67255
      10^3/uL:
        description: Thousand per Microliter (no EVS code in cache).
      '%':
        description: Percentage
        meaning: ncit:C25613
      fL:
        description: Femtoliter
        meaning: ncit:C64780
      pg:
        description: Picogram
        meaning: ncit:C64551
      U/L:
        description: Enzyme Units per Liter (chemistry; no EVS code in cache).
      mmol/L:
        description: Millimole per Liter
        meaning: ncit:C64387
      umol/L:
        description: Micromole per Liter
        meaning: ncit:C64389
      ng/dL:
        description: Nanogram per Deciliter (no EVS code in cache).
  LbTestCdEnum:
    description: Hematology subset of CDISC CT codelist LBTESTCD (C65047), source NCI EVS evs-2026-Q1. Used by Dataset
      Specializations / mappings, not bound to a payload slot (a transfer carries the vendor's code in ctestcd and
      the standard code in lbtestcd, neither of which is constrained to this subset).
    permissible_values:
      HGB:
        description: Hemoglobin Measurement
        meaning: ncit:C64848
      RBC:
        description: Erythrocyte Count
        meaning: ncit:C51946
      WBC:
        description: Leukocyte Count
        meaning: ncit:C51948
      HCT:
        description: Hematocrit Measurement
        meaning: ncit:C64796
      PLAT:
        description: Platelet Count
        meaning: ncit:C51951
      MCV:
        description: Erythrocyte Mean Corpuscular Volume
        meaning: ncit:C64799
      MCH:
        description: Erythrocyte Mean Corpuscular Hemoglobin
        meaning: ncit:C64797
      MCHC:
        description: Erythrocyte Mean Corpuscular Hemoglobin Concentration
        meaning: ncit:C64798
