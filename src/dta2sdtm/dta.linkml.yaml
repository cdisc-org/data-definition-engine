id: https://cdisc.org/dta2sdtm
name: dta_lab_transmission_model
title: DTA Logical Data Model
description: "A logical data model (LDM) covering BOTH senses of \"DTA\" in the CDISC 360i data transfer flow. The\
  \ model is DATASET-AGNOSTIC: a DTA may cover any externally provided data type (laboratory LB, ECG EG, imaging\
  \ TU/TR/RS, PK/PD and others listed in the inventory's BC_Groups sheets). Lab is the first worked example, not\
  \ the scope. The token \"DTA\" is overloaded: the Data Transfer **Agreement** (the governance contract) vs. the\
  \ Data **Transfer** payload (the data that fulfils it). This schema models both as related layers — contract vs.\
  \ fulfilment — joined through the shared BiomedicalConcept hub. Three layers:\n\n  * AGREEMENT LAYER — DataTransferAgreement\
  \ > Study, DtaVersion, BcSelection,\n    TestSpecification, TransferDataset, Party, TransferRequirements,\n  \
  \  VisitMapping, TimepointMapping, Source. The Data Transfer Agreement\n    document, prepopulated from an upstream\
  \ USDM protocol: WHAT data is\n    promised, by whom, in what format, mapped to which visits, and — new in\n \
  \   v0.2.0 — WHICH TESTS arrive and in what dataset structure. Since v0.3.0 each\n    agreed test also carries\
  \ its reference ranges and the SDTM domain it targets. Slot names use\n    snake_case so a serialized agreement\
  \ payload validates directly with\n    `-C DataTransferAgreement`.\n\n  * SEMANTIC LAYER — BiomedicalConcept,\
  \ BcGroup, DatasetSpecialization,\n    VariableSpecialization. The linkage connecting an upstream USDM protocol\n\
  \    (which references Biomedical Concepts on its Activities) to the downstream\n    SDTM datasets (which a Dataset\
  \ Specialization projects each BC into).\n    BcGroup (new in v0.3.0) is the \"Data Type\" the agreement selects:\
  \ a USDM\n    BiomedicalConceptCategory grouping BCs (e.g. ECG > 12 LEAD STANDARD,\n    Imaging > Tumor/Lesion\
  \ Identification, PK/PD > Parent Drug Concentration).\n\n  * INSTANCE LAYER — Transmission > TransferRecord. The\
  \ delivered payload, one\n    flat record per result, typed from the DTA MVP Inventory's Data_Structure\n    sheet.\
  \ That sheet is the one transfer structure agreed so far, and it is the\n    LB structure (its variables are LB-prefixed);\
  \ structures for other datasets\n    are added as further TransferDataset declarations.\n\nBiomedicalConcept is\
  \ the hub joining all three layers: USDM references it (Activity.biomedicalConceptIds), the Agreement scopes it\
  \ in (is_used_by_dta + BcSelection, and per-test via TestSpecification.bc_id), and the payload delivers it.\n\
  AGREEMENT <-> INSTANCE. Two edges make contract-vs-fulfilment real rather than merely asserted:\n  - file level:\
  \ Transmission.dta_version_ref names the DTA version a delivery\n    fulfils;\n  - test level: a natural-key join,\
  \ TestSpecification (test_panel_name +\n    data_provider_test_code, falling back to data_provider_test_name)\
  \ <->\n    TransferRecord (lbpanel + ctestcd / ctest). No surrogate key is used: no\n    real transfer file carries\
  \ one.\n\nPrimary purpose: a typed *transformation source* for DTA -> SDTM, kept traceable in both directions\
  \ (USDM upstream, SDTM downstream). The SDTM derivation is a function of (TransferRecord x TestSpecification):\
  \ the payload carries the value, the agreement carries the per-test facts no payload can (unit conversion, result\
  \ form, BC identity).\nDESIGN RULE — permissive payload, strict agreement. Enumerations are bound on the agreement\
  \ side, where the sponsor controls the values. Payload slots that a vendor populates (units, status, dates) stay\
  \ unconstrained strings so a conformant-but-unanticipated file is not rejected at the door; discrepancies surface\
  \ in the transform by comparing payload against agreement."
license: MIT
version: 0.4.0
prefixes:
  linkml: https://w3id.org/linkml/
  dta: https://cdisc.org/dta2sdtm/
  ncit: http://purl.obolibrary.org/obo/NCIT_
  labtx: https://wiki.cdisc.org/spaces/LAB2DOT0/pages/351701120/LAB+Transmission+Model+Metadata+Table#
default_prefix: dta
default_range: string
imports:
- linkml:types
classes:
  DataTransferAgreement:
    description: 'The Data Transfer Agreement document: the governance contract that declares WHAT data will be
      transferred, by WHOM, in what FORMAT, mapped to which VISITS, comprising WHICH TESTS, in WHICH DATASET STRUCTURE.
      Root of the agreement graph; the contract a Transmission later fulfils.'
    slots:
    - app_name
    - source
    - study
    - dta_version
    - data_types
    - data_type_groups
    - data_type_details
    - test_specification
    - data_structure
    - parties
    - transfer
    - visit_mapping
    - timepoint_mapping
    - suggested_controls
    slot_usage:
      source:
        description: Provenance of the inputs the agreement was generated from.
        range: Source
        inlined: true
    annotations:
      fulfilled_by: Transmission (instance layer), named explicitly by Transmission.dta_version_ref
  Study:
    description: USDM-sourced study context prepopulated into the agreement. Read-only projection of the upstream
      USDM protocol.
    slots:
    - study_name
    - study_identifier
    - study_title
    - version_identifier
    - version_id
    - design_id
    - description
    - summary
    - provider_study_identifiers
    - service_provider_identifiers
    annotations:
      usdm_source: Study / StudyVersion / StudyDesign
      dta_section: 1
  StudySummary:
    description: Roll-up counts of the USDM source the agreement was derived from.
    slots:
    - organizations
    - roles
    - assigned_persons
    - encounters
    - biomedical_concepts
    - bc_surrogates
  DtaVersion:
    description: One row of the DTA version history (document version number + date).
    slots:
    - version_number
    - version_date
    - version_change_narrative
    - dta_status
    annotations:
      dta_section: 6
      section_note: Inventory v2 renumbers DTA Version History from section 3 to 6, which is the number Visit Mapping
        also carries. Recorded as given; the collision is raised with the workstream rather than resolved here.
  BcSelection:
    description: 'A biomedical concept SELECTED into the agreement scope (the `data_type_details` of an agreement).
      The agreement-side projection of a BiomedicalConcept: carries the NCI C-code, short name, and the faceted
      classification rows that backed the selection. Join to the canonical BiomedicalConcept on `bc_id` == BiomedicalConcept.nciCode.'
    slots:
    - key
    - bc_id
    - short_name
    - facets
    annotations:
      joins_to: BiomedicalConcept (bc_id -> nciCode) — agreement-scoped BC selection
      dta_section: 2
  TestSpecification:
    description: 'One agreed TEST in the DTA test specification table: the per-test heart of the agreement. Declares
      how a single test will arrive — vendor and standard codes, method, specimen, LOINC, data type, the three unit
      representations, blinding — before any data exists.

      Deliberately FLAT: the source sheet directs "There can be multiple test panels listed in the same DTA test
      specification table. Therefore keep at record level although it is at the grouping level in Lab v2." Panel
      name is a field here, not a grouping class.

      This class carries the per-test facts the payload structurally cannot: the unit conversion basis (reported
      vs conventional vs SI), the result form (`data_type`, which tells the SDTM transform whether LBORRES is castable
      to LBSTRESN), and the BC identity. The SDTM derivation is a function of (TransferRecord x this).

      Dataset-agnostic: the same row shape carries a lab test (LB), an ECG measurement (EG), or a tumour assessment
      (TU/TR). `sdtm_domain` says which; annotations name SDTM targets with the generic "--" prefix (--TESTCD, --ORRESU)
      so they resolve per domain. Columns that do not apply to a data type (e.g. specimen for ECG) are simply left
      empty.'
    slots:
    - sdtm_domain
    - test_panel_name
    - category
    - subcategory
    - bc_id
    - data_provider_test_code
    - data_provider_test_name
    - data_provider_test_description
    - test_name
    - test_code
    - method
    - specimen
    - loinc_code
    - data_type
    - display_format
    - significant_digits
    - reported_unit
    - result_values
    - reported_reference_range_low
    - reported_reference_range_high
    - conventional_unit
    - conventional_reference_range_low
    - conventional_reference_range_high
    - si_unit
    - si_reference_range_low
    - si_reference_range_high
    - blinding_flag
    - test_tracking_status
    - usdm_bc_id
    annotations:
      source_sheet: DTA_MVP_Inventory latest.xlsx / Test_Specification
      joins_to_instance: TransferRecord on (test_panel_name -> lbpanel, data_provider_test_code -> ctestcd), falling
        back to (test_panel_name -> lbpanel, data_provider_test_name -> ctest) where the vendor code is absent.
      joins_to_concept: BiomedicalConcept (bc_id -> nciCode)
      usdm_scope: Resolve properties and enabled responses within the same configured biomedical concept.
      usdm_source: StudyVersion.biomedicalConcepts (one configured BC per mapped row)
    slot_usage:
      test_panel_name:
        annotations:
          mandatory: R
          natural_key: true
          mvp_inclusion: Y
          source_column: Test Panel Name
          usdm_mapping_note: bcCategory.label
          mapping_status: direct
          mapping_cell: Test_Specification!B18
          usdm_property: bcCategory.label
      category:
        annotations:
          mandatory: R
          sdtm_target: --CAT
          mvp_inclusion: Y
          source_column: Category (SDTM)
          usdm_mapping_note: '**.biomedicalConcepts.properties[code.standardCode.code="C83017"].responseCodes.code.decode'
          mapping_status: direct
          mapping_cell: Test_Specification!C18
          usdm_property: '**.biomedicalConcepts.properties[code.standardCode.code="C83017"].responseCodes.code.decode'
      subcategory:
        annotations:
          mandatory: O
          sdtm_target: --SCAT
          mvp_inclusion: N
          source_column: Subcategory
          usdm_mapping_note: similar to category (other code)
          mapping_status: unresolved code
          mapping_cell: Test_Specification!D18
      bc_id:
        annotations:
          mvp_inclusion: Y
          mandatory: R
          source_column: BC ID
          usdm_mapping_note: biomedicalConcept.code.standardCode.code
          mapping_status: direct
          mapping_cell: Test_Specification!E18
          usdm_property: biomedicalConcept.code.standardCode.code
      data_provider_test_code:
        annotations:
          mandatory: R
          natural_key: true
          instance_slot: ctestcd
          mvp_inclusion: Y
          source_column: Data Provider Test Code
          usdm_mapping_note: '**.biomedicalConcepts.properties[code.standardCode.code="C65047"].responseCodes.code.decode'
          mapping_status: direct
          mapping_cell: Test_Specification!F18
          usdm_property: '**.biomedicalConcepts.properties[code.standardCode.code="C65047"].responseCodes.code.decode'
      data_provider_test_name:
        annotations:
          mandatory: R
          natural_key: fallback
          instance_slot: ctest
          mvp_inclusion: Y
          source_column: Data Provider Test Name
          usdm_mapping_note: '**.biomedicalConcepts.properties[code.standardCode.code="C67154"].responseCodes.code.decode'
          mapping_status: direct
          mapping_cell: Test_Specification!G18
          usdm_property: '**.biomedicalConcepts.properties[code.standardCode.code="C67154"].responseCodes.code.decode'
      data_provider_test_description:
        annotations:
          mandatory: O
          mvp_inclusion: Y
          source_column: Data Provider Test Description
          usdm_mapping_note: biomedicalConcept.label / extension (to make it specific for DTA) / or notes
          mapping_status: mapping alternatives
          mapping_cell: Test_Specification!H18
      test_name:
        annotations:
          mandatory: R
          sdtm_target: --TEST
          mvp_inclusion: Y
          source_column: Test Name
          usdm_mapping_note: can this be equal to test code? Otherwise extension
          mapping_status: proposed extension
          mapping_cell: Test_Specification!I18
      test_code:
        annotations:
          mandatory: R
          sdtm_target: --TESTCD
          mvp_inclusion: Y
          source_column: Test Code
          usdm_mapping_note: '**.biomedicalConcepts.properties[code.standardCode.code="C65047"].responseCodes.code.code'
          mapping_status: direct
          mapping_cell: Test_Specification!J18
          usdm_property: '**.biomedicalConcepts.properties[code.standardCode.code="C65047"].responseCodes.code.code'
      method:
        annotations:
          mandatory: R
          sdtm_target: --METHOD
          mvp_inclusion: Y
          source_column: Method
          usdm_mapping_note: '**.biomedicalConcepts.properties[code.standardCode.code="C82535"].responseCodes[isEnabled=True].code.decode'
          mapping_status: direct
          mapping_cell: Test_Specification!K18
          usdm_property: '**.biomedicalConcepts.properties[code.standardCode.code="C82535"].responseCodes[isEnabled=True].code.decode'
      specimen:
        annotations:
          mandatory: R
          sdtm_target: --SPEC
          mvp_inclusion: Y
          source_column: Specimen
          usdm_mapping_note: '**.biomedicalConcepts.properties[code.standardCode.code="C70713"].responseCodes[isEnabled=true].code.decode'
          mapping_status: direct
          mapping_cell: Test_Specification!L18
          usdm_property: '**.biomedicalConcepts.properties[code.standardCode.code="C70713"].responseCodes[isEnabled=true].code.decode'
      loinc_code:
        annotations:
          mandatory: O
          sdtm_target: --LOINC
          mvp_inclusion: N
          source_column: LOINC
          usdm_mapping_note: biomedicalConcept.code.standardCodeAliases[codeSystem="LOINC"].code.code
          mapping_status: direct
          mapping_cell: Test_Specification!M18
          usdm_property: biomedicalConcept.code.standardCodeAliases[codeSystem="LOINC"].code.code
      data_type:
        annotations:
          mandatory: R
          sdtm_use: gates the LBSTRESC/LBSTRESN derivation
          mvp_inclusion: Y
          source_column: Data type
          usdm_mapping_note: 'Do you mean the datatype of the result? Then you can point to the result property:
            **.biomedicalConcepts.properties[code.standardCode.code="C70856"].datatype'
          mapping_status: conditional
          mapping_cell: Test_Specification!N18
      display_format:
        annotations:
          mandatory: O
          mvp_inclusion: Y
          source_column: Display Format
          usdm_mapping_note: extension?
          mapping_status: proposed extension
          mapping_cell: Test_Specification!O18
      significant_digits:
        annotations:
          mvp_inclusion: Y
          mandatory: O
          source_column: Significant Digits
          usdm_mapping_note: extension?
          mapping_status: proposed extension
          mapping_cell: Test_Specification!P18
      reported_unit:
        annotations:
          mandatory: R
          recommended_codelist: UNIT (C71620)
          sdtm_target: --ORRESU
          source_column: Performing Lab Reported Unit
          mvp_inclusion: Y
          usdm_mapping_note: "Unit code system may differ among tests. THis is an example of one of them (change\
            \ c-code for other unit coding systems or define an array of all applicable C-codes): \n**.biomedicalConcepts.properties[code.standardCode.code=\"\
            C67391\"].responseCodes[isEnabled=true].code.decode"
          mapping_status: unit-system dependent
          mapping_cell: Test_Specification!Q18
      result_values:
        annotations:
          mandatory: O
          source_column: Performing Lab Result values / Codelist
          mvp_inclusion: Y
      reported_reference_range_low:
        annotations:
          sdtm_target: --ORNRLO
          source_column: Performing Lab Reported Reference Range Unit Low
          mvp_inclusion: Y
          mandatory: R
      reported_reference_range_high:
        annotations:
          sdtm_target: --ORNRHI
          source_column: Performing Lab Reported Reference Range Unit High
          mvp_inclusion: Y
          mandatory: R
      conventional_unit:
        annotations:
          mandatory: R
          recommended_codelist: UNIT (C71620)
          mvp_inclusion: Y
          source_column: Conventional Unit
      conventional_reference_range_low:
        annotations:
          source_column: Conventional Reference Range Unit Low
          mvp_inclusion: Y
          mandatory: O
      conventional_reference_range_high:
        annotations:
          source_column: Conventional Reference Range Unit High
          mvp_inclusion: Y
          mandatory: O
      si_unit:
        annotations:
          mandatory: R
          recommended_codelist: UNIT (C71620)
          sdtm_target: --STRESU
          mvp_inclusion: Y
          source_column: SI Unit
      si_reference_range_low:
        annotations:
          sdtm_target: --STNRLO
          source_column: SI (Reference Range) Unit Low
          mvp_inclusion: Y
          mandatory: O
      si_reference_range_high:
        annotations:
          sdtm_target: --STNRHI
          source_column: SI (Reference Range) Unit High
          mvp_inclusion: Y
          mandatory: O
      blinding_flag:
        annotations:
          mandatory: R
          mvp_inclusion: Y
          source_column: Blinding Flag
      test_tracking_status:
        annotations:
          mandatory: O
          source_column: Performing Lab Test Tracking Status
          illustrative_values: ORDERED; AWAITING SAMPLES/SAMPLES IN TRANSIT; IN PROGRESS; ON HOLD; PENDING/WAITING;
            REANALYSIS/REPEAT; IN REVIEW; CLOSED/DONE; COMPLETED CANCELLED (LAB v2 PLBTTS, verbatim)
          mvp_inclusion: Y
  TransferDataset:
    description: 'The dataset structure the agreement PROMISES: the declared variable list of the transferred file,
      with per-variable format, length, controlled terminology, core/mandatory status and vendor-side naming. The
      agreement-side statement of the structure that TransferRecord instances conform to.'
    slots:
    - dataset_name
    - dataset_description
    - variables
    annotations:
      source_sheet: DTA_MVP_Inventory latest.xlsx / Data_Structure
      conformed_to_by: TransferRecord
  TransferVariable:
    description: 'One declared variable of the TransferDataset: its label, description, format, length, controlled
      terminology, value list, example values, core/mandatory status, unblinded flag, and the vendor''s own name/label/terminology
      for it.'
    slots:
    - variable_name
    - variable_label
    - variable_description
    - variable_data_type
    - variable_length
    - controlled_terminology
    - value_lists
    - example_values
    - core_variable
    - mandatory_variable_flag
    - mandatory_value
    - variable_unblinded
    - vendor_variable_name
    - vendor_variable_label
    - vendor_controlled_terminology
    - source_record_identifier
    - visit_identifier
  Party:
    description: A party in the DTA signature table. Each carries its data-exchange role (Data Provider vs Data
      Recipient) and organization type.
    slots:
    - id
    - name
    - role
    - organization
    - organization_type
    - data_exchange_role
    - email
    - signature_date
    - source
    - phone_number
    slot_usage:
      source:
        description: Field-level provenance of this party's data (USDM / UI / both).
        range: ProvenanceEnum
      role:
        description: Role from the study role code, not the person's job title.
        annotations:
          recommended_codelist: StudyRoleEnum
          usdm_mapping_note: study.versions.roles.code.decode - the person with corresponding details are nested
            with the assignedPerson details. Then no company is expected to be referred to directly but via the
            assignedPerson if needed.
          mapping_status: direct
          mapping_cell: DTA_Attributes!M15
          usdm_property: study.versions.roles.code.decode - the person with corresponding details are nested with
            the assignedPerson details. Then no company is expected to be referred to directly but via the assignedPerson
            if needed.
    annotations:
      dta_section: 4
  TransferRequirements:
    description: 'The file-transfer mechanics agreed for the transmission: format, encoding, delimiter, method,
      cumulative/incremental, schedule, environment, blinding, and the provider/recipient folder names.'
    slots:
    - file_name
    - file_format
    - encoding_system
    - delimiter
    - transmission_method
    - transmission_type
    - transfer_schedule
    - transfer_blinding
    - environments
    annotations:
      dta_section: 5
  VisitMapping:
    description: One row of the protocol<->data-provider visit crosswalk. Protocol visit number/name are USDM-locked;
      the data-provider values are authored by the lab. This crosswalk is what the DTA->SDTM transform uses to recover
      VISIT / VISITNUM.
    slots:
    - protocol_visit_number
    - protocol_visit_name
    - data_provider_visit_number
    - data_provider_visit_name
    - source
    slot_usage:
      source:
        description: 'Field-level provenance of the row: protocol columns are USDM-locked and the data-provider
          columns are lab-authored, so a populated row is typically "USDM + UI".'
        range: ProvenanceEnum
    annotations:
      sdtm_use: recovers VISIT / VISITNUM; pairs with TransferRecord.visit / .visitnum
      dta_section: 6
  TimepointMapping:
    description: Crosswalk between a protocol timeline instance and its provider timepoint.
    slots:
    - protocol_timepoint_number
    - protocol_timepoint_name
    - data_provider_timepoint_number
    - data_provider_timepoint_name
    - source
    slot_usage:
      source:
        description: Field-level provenance of the row (USDM / UI / both).
        range: ProvenanceEnum
    annotations:
      dta_section: 7
  Source:
    description: 'Provenance of the inputs the agreement was generated from (source-control indication): the USDM
      protocol, the MVP metadata, and any DTA template.'
    slots:
    - usdm
    - mvp
    - template
    - usdm_sha256
    - usdm_lineage
  BiomedicalConcept:
    description: 'A CDISC Biomedical Concept (BC): a machine-readable definition of a clinical idea (e.g. "Hemoglobin
      Concentration in Blood"), independent of any dataset. USDM v4 references BCs from study Activities via `biomedicalConceptIds`;
      this class is the join target for that reference.'
    slots:
    - conceptId
    - conceptName
    - nciCode
    - loincCodes
    - usdmReference
    - classifications
    annotations:
      usdm_entity: BiomedicalConcept
      usdm_link: Activity.biomedicalConceptIds -> BiomedicalConcept.id
  BcClassification:
    description: 'One faceted classification row for a BiomedicalConcept (from the MVP metadata lookup): a `group_name`
      (the facet dimension — category, disease_area, is_used_by_form, is_used_by_dta) plus its `value`. The `is_used_by_dta`
      facet is the explicit, queryable BC->DTA membership edge. Shared by BiomedicalConcept.classifications and
      BcSelection.facets.'
    slots:
    - group_name
    - value
    annotations:
      mvp_source: MVP metadata lookup rows (bc_id, group_name, value)
  BcGroup:
    description: 'A group of biomedical concepts: the "Data Type" a DTA selects (DTA_Attributes section 2, "BC Selection
      Criterion", USDM Attribute "BiomedicalConceptCategory / BC Group"). Nests: a top-level group (ECG, Imaging,
      PK/PD) contains sub-groups (12 LEAD STANDARD; Tumor/Lesion Identification; Parent Drug Concentration), which
      list their member concepts.

      Aligned to USDM BiomedicalConceptCategory (C201346): bc_group_name = name, bc_group_description = description,
      child_groups = childIds, member_concepts = memberIds. Members are recorded as the inventory gives them — a
      BC NCI C-code where one exists, otherwise the concept or test name — because the ECG and Imaging BC_Groups
      sheets mark most of their tests "(no BC)". A member that is a C-code joins BiomedicalConcept.nciCode.'
    slots:
    - bc_group_name
    - bc_group_description
    - sdtm_domain
    - member_concepts
    - child_groups
    slot_usage:
      sdtm_domain:
        description: SDTM domain this group's concepts are tabulated into, where the inventory states one (e.g.
          "Tumor/Lesion Identification;TU").
    annotations:
      usdm_entity: BiomedicalConceptCategory
      usdm_link: StudyVersion.bcCategories -> BiomedicalConceptCategory
      source_sheet: DTA_MVP_Inventory v2.xlsx / BC_Groups, ECG BC_Groups, Imaging BC_Groups
  DatasetSpecialization:
    description: 'A CDISC SDTM Dataset Specialization (COSMoS): the projection of one BiomedicalConcept into a specific
      SDTM domain (LB, EG, VS, ...), expressed as value-level metadata over a set of VariableSpecializations. This
      is the authoritative bridge: BC concept -> concrete SDTM variables/codelists. System of record: cdisc-org/COSMoS
      export.'
    slots:
    - specializationId
    - biomedicalConcept
    - vlmGroupId
    - domain
    - sdtmigStartVersion
    - packageDate
    - source
    - variableSpecializations
    annotations:
      cdisc_artifact: SDTM Dataset Specialization
      system_of_record: cdisc-org/COSMoS export/cdisc_sdtm_dataset_specializations_latest.csv
  VariableSpecialization:
    description: 'One value-level-metadata row of a DatasetSpecialization: how a single SDTM variable is constrained
      for this concept (assigned term, codelist, value list, role, type, origin).'
    slots:
    - sdtmVariable
    - role
    - assignedValue
    - codelistCode
    - codelistName
    - valueList
    - decId
    - dataType
    - mandatoryVariable
    - originType
  Transmission:
    tree_root: true
    description: 'File-level header for one transmitted DTA file, plus the records it carries.

      `dta_version_ref` is the agreement<->instance edge at file level: it names the DTA document version this delivery
      fulfils, so a received file can always be traced to the contract that authorized it.

      NOTE ON PROVENANCE: the Data_Structure sheet specifies dataset variables only and declares no file-level metadata,
      so this header is not derived from it. `igvrsn`, `fcrdtc`, `trssid` and `trstyp` are retained from the LAB
      Transmission Model, where they are grounded; `transfer_structure_version` and `dta_version_ref` are project-defined
      (see their own annotations) and are NOT CDISC-registered variables.'
    slots:
    - transfer_structure_version
    - igvrsn
    - fcrdtc
    - trssid
    - trstyp
    - dta_version_ref
    - records
  TransferRecord:
    description: 'THE GRAIN: one flat record per result, as agreed in the Data_Structure sheet of the DTA MVP Inventory
      — the LB transfer structure, the only one the inventory has agreed so far. Replaces the v0.1.0 nested LAB
      v2 graph (Subject > Collection > Specimen > Panel > LabTestResult > Result).

      This is a change of transfer VOCABULARY, not merely of shape: the removed graph modelled LAB v2 variables
      (LTVRSN, ACCSNID, SPECID, PLBTID, PLRCRS...); this class models SDTM-shaped columns plus vendor passthrough
      (CTESTCD, CTEST, CUNIT, CSPEC, CMETHOD, CPANEL) and ten AUX escape hatches. The two share essentially only
      STUDYID.

      Per the schema''s permissive-payload rule, vendor-populated slots (lborresu, lbstat, lbdtc, all C* passthrough)
      are unconstrained strings. Only the four variables the source sheet types as numeric are typed numerically
      — which is what stops a categorical result such as "STRAW" being cast to LBSTRESN.'
    slots:
    - studyid
    - domain
    - usubjid
    - subjid
    - lbgrpid
    - lbrefid
    - lbtestcd
    - lbtest
    - lbtstdtl
    - lbcat
    - lbscat
    - lborres
    - lborresu
    - lbrescat
    - lbstat
    - lbreasnd
    - lbnam
    - lbloinc
    - lbspec
    - lbspccnd
    - lbmethod
    - lbrunid
    - lbanmeth
    - lblloq
    - visitnum
    - visit
    - lbdtc
    - lbtpt
    - lbtptnum
    - lbcode
    - lbdupnum
    - lbtstcnd
    - lbcndagt
    - lbanstat
    - lbpanel
    - lbgate
    - lbmrkstr
    - lbclmeth
    - lbtmthsn
    - lbreagnt
    - lbmthdds
    - lbbdagnt
    - lbrqual
    - aux1
    - aux2
    - aux3
    - aux4
    - aux5
    - aux6
    - aux7
    - aux8
    - aux9
    - aux10
    - lbvrefid
    - ctestcd
    - ctest
    - cunit
    - cspec
    - cmethod
    - cpanel
    annotations:
      source_sheet: DTA_MVP_Inventory v2.xlsx / Data_Structure
      conforms_to: TransferDataset
      joins_to_agreement: TestSpecification on (lbpanel -> test_panel_name, ctestcd -> data_provider_test_code),
        falling back to ctest -> data_provider_test_name.
      known_gap: The Data_Structure sheet declares no per-record transaction type, so an incremental transfer cannot
        express a record-level delete; only the file-level TransferRequirements.transmission_type (Cumulative/Incremental)
        and Transmission.trstyp are available.
  TransferEnvironmentSettings:
    slots:
    - transfer_environment
    - folder_name_provider
    - folder_name_recipient
  SuggestedControls:
    description: Optional, unapproved post-MVP proposals; not validation requirements.
    slots:
    - constraints
    - data_generation_rules
    - exception_handling
    - transformations
    - vendor_qc
    - conformance_rule_refs
    - reconciliation
    - issue_loop
    - issue_resolution_timelines
slots:
  app_name:
    description: Identifier of the application/build that produced the agreement payload.
  study:
    description: USDM-sourced study context for the agreement.
    range: Study
    inlined: true
  dta_version:
    description: DTA document version (number + date).
    range: DtaVersion
    inlined: true
    multivalued: true
    inlined_as_list: true
  data_types:
    description: Human-readable labels of the data types (BC groups / concepts) selected into scope, as the DTA
      authoring app emits them. See data_type_groups for the structured form.
    multivalued: true
  data_type_groups:
    description: 'The BC groups (data types) the agreement covers, e.g. ECG > 12 LEAD STANDARD or Imaging > Tumor/Lesion
      Results. The structured form of `data_types`: that slot keeps the flat display labels the DTA authoring app
      emits; this one carries the group hierarchy and members.'
    range: BcGroup
    multivalued: true
    inlined_as_list: true
    annotations:
      usdm_property: StudyVersion.bcCategories (BiomedicalConceptCategory)
      dta_section: 2
  data_type_details:
    description: The biomedical concepts selected into the agreement scope, with facets.
    range: BcSelection
    multivalued: true
    inlined_as_list: true
    annotations:
      usdm_mapping_note: study.versions.biomedicalConcepts.properties.datatype (related to the Orres variable and/or
        property C-Code= C70856)
      mapping_status: 'review: result datatype is not a BC selection identifier'
      mapping_cell: DTA_Attributes!M7
  test_specification:
    description: The agreed tests — one row per test in the DTA test specification table.
    range: TestSpecification
    multivalued: true
    inlined_as_list: true
  data_structure:
    description: The declared structure of the transferred dataset.
    range: TransferDataset
    inlined: true
  parties:
    description: Parties included in the DTA signature table.
    range: Party
    multivalued: true
    inlined_as_list: true
  transfer:
    description: Agreed file-transfer mechanics.
    range: TransferRequirements
    inlined: true
    multivalued: true
    inlined_as_list: true
  visit_mapping:
    description: Protocol<->data-provider visit crosswalk rows.
    range: VisitMapping
    multivalued: true
    inlined_as_list: true
  timepoint_mapping:
    description: Optional protocol<->data-provider timepoint crosswalk rows.
    range: TimepointMapping
    multivalued: true
    inlined_as_list: true
  study_name:
    description: USDM study name (e.g. NCT number).
  study_identifier:
    description: Study identifier (USDM StudyIdentifier).
    annotations:
      usdm_mapping_note: "study.versions.studyIdentifiers.text + study.studyIdentifiers.scopeId = id of sponsor\
        \ organization. Jsonata query: (study.versions)@$sv.$sv.studyIdentifiers[scopeId in $sv.roles[code.code=\"\
        C70793\"].organizationIds[0]].text \n(See HB 1 Page 22: https://www.cdisc.org/sites/default/files/2026-06/USDM-HB1%20v1.0_FINAL.pdf)"
      mapping_status: direct
      mapping_cell: DTA_Attributes!M2
      usdm_property: "study.versions.studyIdentifiers.text + study.studyIdentifiers.scopeId = id of sponsor organization.\
        \ Jsonata query: (study.versions)@$sv.$sv.studyIdentifiers[scopeId in $sv.roles[code.code=\"C70793\"].organizationIds[0]].text\
        \ \n(See HB 1 Page 22: https://www.cdisc.org/sites/default/files/2026-06/USDM-HB1%20v1.0_FINAL.pdf)"
  study_title:
    description: Study / protocol title. The original title, not an acronym.
    annotations:
      usdm_mapping_note: study.versions.titles.text (type="Official Study Title")
      mapping_status: direct
      mapping_cell: DTA_Attributes!M3
      usdm_property: study.versions.titles.text (type="Official Study Title")
  version_identifier:
    description: USDM study version identifier.
    annotations:
      usdm_mapping_note: study.versions.versionIdentifier or study.documentedBy.versions.version (the second is
        directly related to the protocol document while the first is the overall study version - this is usually
        the same but can be different conceptually)
      mapping_status: alternative sources
      mapping_cell: DTA_Attributes!M4
  version_id:
    description: USDM StudyVersion id.
  design_id:
    description: USDM StudyDesign id.
  description:
    description: Study description / synopsis.
  summary:
    description: Roll-up counts of the USDM source.
    range: StudySummary
    inlined: true
  organizations:
    description: Count of USDM organizations.
    range: integer
  roles:
    description: Count of USDM study roles.
    range: integer
  assigned_persons:
    description: Count of assigned persons across roles.
    range: integer
  encounters:
    description: Count of USDM encounters (visits).
    range: integer
  biomedical_concepts:
    description: Count of USDM biomedical concepts.
    range: integer
  bc_surrogates:
    description: Count of BC surrogates.
    range: integer
  version_number:
    description: DTA document version number (e.g. 1.0).
  version_date:
    description: DTA document version date (ISO 8601).
  version_change_narrative:
    description: Description of the change and the rationale for this DTA version.
  key:
    description: Stable selection key ("<bc_id>||<short_name>") from the lookup.
  bc_id:
    description: NCI Thesaurus C-code of the concept. Joins to BiomedicalConcept.nciCode. Used by BcSelection (concept
      scope) and TestSpecification (per-test concept identity).
    annotations:
      usdm_property: biomedicalConcept.code.standardCode.code
  short_name:
    description: Concept short name (e.g. "Leukocyte Count").
  facets:
    description: The faceted classification rows backing this selection.
    range: BcClassification
    multivalued: true
    inlined_as_list: true
  sdtm_domain:
    description: 'SDTM domain the test''s results are tabulated into (e.g. LB, EG, TU, TR, RS). Resolves the generic
      "--" prefix of the sdtm_target annotations on the other TestSpecification slots. Not a Test_Specification
      column: grounded in the inventory''s Imaging BC_Groups sheet ("Domain" column: TU / TR / RS) and ECG BC_Groups
      sheet (EGTEST / EGTESTCD columns), which show the test table must span domains. Optional — omitted, the domain
      follows from the TransferDataset.'
    annotations:
      provenance: DTA_MVP_Inventory v2.xlsx / Imaging BC_Groups, ECG BC_Groups
      sdtm_target: DOMAIN
  test_panel_name:
    description: Test panel name. Kept at record level per the source sheet, even though Lab v2 treats panel as
      a grouping level. Part of the natural key to TransferRecord.lbpanel.
    exact_mappings:
    - labtx:TSTPNL
    annotations:
      mandatory: R
      natural_key: true
  category:
    description: SDTM category for the test (Lab v2 "Data Recipient Test Category"). The inventory v2 cites this
      as "DTRTTCT"; the LAB v2 metadata table defines only DTRTCT, so the mapping uses the registered code.
    exact_mappings:
    - labtx:DTRTCT
    annotations:
      mandatory: R
      sdtm_target: --CAT
  subcategory:
    description: Further categorization of the test (e.g. used for Flow Cytometry, Genetics).
    annotations:
      mandatory: O
      sdtm_target: --SCAT
  data_provider_test_code:
    description: The performing laboratory's own test code. Part of the natural key.
    exact_mappings:
    - labtx:PLBTID
    annotations:
      mandatory: R
      natural_key: true
      instance_slot: ctestcd
  data_provider_test_name:
    description: The performing laboratory's own test name. Natural-key fallback where the vendor test code is absent
      — which it is for 9 of the 11 example rows in the source sheet (flow cytometry and IHC panels name tests without
      coding them).
    exact_mappings:
    - labtx:PLBTNM
    annotations:
      mandatory: R
      natural_key: fallback
      instance_slot: ctest
  data_provider_test_description:
    description: Long text description of the test. Retained for traceability where the provider test differs from
      the intended BC.
    exact_mappings:
    - labtx:PLBTDS
    annotations:
      mandatory: O
  test_name:
    description: Standard (data recipient) test name.
    exact_mappings:
    - labtx:DTRTNM
    annotations:
      mandatory: R
      sdtm_target: --TEST
  test_code:
    description: Standard (data recipient) test identifier.
    exact_mappings:
    - labtx:DTRTID
    annotations:
      mandatory: R
      sdtm_target: --TESTCD
  method:
    description: Method of the test or examination (e.g. HPLC, DIPSTICK, FLOW CYTOMETRY, IHC).
    annotations:
      mandatory: R
      sdtm_target: --METHOD
  specimen:
    description: Specimen type the test is performed on (e.g. BLOOD, URINE, Cryo PBMC). Empty for data types with
      no specimen (e.g. ECG, imaging).
    annotations:
      mandatory: R
      sdtm_target: --SPEC
  loinc_code:
    description: LOINC code uniquely identifying the test.
    annotations:
      mandatory: O
      sdtm_target: --LOINC
  data_type:
    description: 'Declared form of the result (e.g. numeric, "<text 200>"). THE KEY SDTM INPUT: it tells the transform
      whether LBORRES can be cast to LBSTRESN. Without it a categorical result such as a urinalysis colour is attempted
      as a number.'
    annotations:
      mandatory: R
      sdtm_use: gates the LBSTRESC/LBSTRESN derivation
  display_format:
    description: Display format for the result.
    annotations:
      mandatory: O
  reported_unit:
    description: Unit the result is reported in by the data provider. Recommended source is CDISC CT codelist UNIT
      (C71620); not bound as an enum because agreements legitimately use units outside any fixed subset.
    exact_mappings:
    - labtx:PLRU
    annotations:
      mandatory: R
      recommended_codelist: UNIT (C71620)
      sdtm_target: --ORRESU
      source_column: Performing Lab Reported Unit
  result_values:
    description: Permitted result values or the codelist name governing them.
    annotations:
      mandatory: O
      source_column: Performing Lab Result values / Codelist
  reported_reference_range_low:
    description: 'Lower limit of the reference range in the reported unit, as agreed for this test. String, like
      the SDTM target: reported limits can be non-numeric.'
    exact_mappings:
    - labtx:PLRRLO
    annotations:
      sdtm_target: --ORNRLO
      source_column: Performing Lab Reported Reference Range Unit Low
  reported_reference_range_high:
    description: 'Upper limit of the reference range in the reported unit, as agreed for this test. String, like
      the SDTM target: reported limits can be non-numeric.'
    exact_mappings:
    - labtx:PLRRHI
    annotations:
      sdtm_target: --ORNRHI
      source_column: Performing Lab Reported Reference Range Unit High
  conventional_unit:
    description: Conventional unit for the test.
    exact_mappings:
    - labtx:CVU
    annotations:
      mandatory: R
      recommended_codelist: UNIT (C71620)
  conventional_reference_range_low:
    description: Lower limit of the reference range in the conventional unit.
    range: float
    exact_mappings:
    - labtx:CVURLO
    annotations:
      source_column: Conventional Reference Range Unit Low
  conventional_reference_range_high:
    description: Upper limit of the reference range in the conventional unit.
    range: float
    exact_mappings:
    - labtx:CVURHI
    annotations:
      source_column: Conventional Reference Range Unit High
  si_unit:
    description: SI unit for the test.
    exact_mappings:
    - labtx:SIU
    annotations:
      mandatory: R
      recommended_codelist: UNIT (C71620)
      sdtm_target: --STRESU
  si_reference_range_low:
    description: 'Lower limit of the reference range in the SI unit. Numeric, like the SDTM target: the standardized
      range is what --NRIND is computed against.'
    range: float
    exact_mappings:
    - labtx:SIURLO
    annotations:
      sdtm_target: --STNRLO
      source_column: SI (Reference Range) Unit Low
  si_reference_range_high:
    description: 'Upper limit of the reference range in the SI unit. Numeric, like the SDTM target: the standardized
      range is what --NRIND is computed against.'
    range: float
    exact_mappings:
    - labtx:SIURHI
    annotations:
      sdtm_target: --STNRHI
      source_column: SI (Reference Range) Unit High
  blinding_flag:
    description: Whether this test's results are blinded.
    range: boolean
    annotations:
      mandatory: R
  test_tracking_status:
    description: 'Tracking status of the test at the performing laboratory / data provider (e.g. Ordered, Received,
      Final). Replaces v0.2.0 `agreement_status`: inventory v2 renames the column from "Status" to "Performing Lab
      Test Tracking Status" and maps it to LAB v2 PLBTTS, settling that it is an operational tracking status, not
      the negotiation state between the parties. Not bound to an enum: the LAB v2 list is marked "values for illustrative
      purposes only" (codelist "(NEW)"), and the inventory''s own examples (Final, Received) fall outside it.'
    exact_mappings:
    - labtx:PLBTTS
    annotations:
      mandatory: O
      source_column: Performing Lab Test Tracking Status
      illustrative_values: ORDERED; AWAITING SAMPLES/SAMPLES IN TRANSIT; IN PROGRESS; ON HOLD; PENDING/WAITING;
        REANALYSIS/REPEAT; IN REVIEW; CLOSED/DONE; COMPLETED CANCELLED (LAB v2 PLBTTS, verbatim)
  dataset_name:
