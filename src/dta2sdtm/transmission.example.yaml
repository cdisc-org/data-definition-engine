# ─────────────────────────────────────────────────────────────────────────────
# Mock DTA transfer payload — CDISC Pilot study H2Q-MC-LZZT
# Validates against dta.linkml.yaml v0.2.0 (root class: Transmission).
#
# Rewritten for v0.2.0: flat TransferRecord list per the DTA MVP Inventory's
# Data_Structure sheet, replacing the v0.1.0 nested LAB v2 graph.
#
# Two subjects at their first collection (E1), each with a HEMATOLOGY and a
# CHEMISTRY panel, plus two records that exercise specific downstream cases:
#
#   * the URINALYSIS record carries lborres "STRAW" — a categorical result. This
#     is the exact shape that produces the 8,414 "LBSTRESN cast failed" rows in
#     out/reports/gap_report.md. It is only safe to derive LBSTRESN when the
#     matching TestSpecification.data_type says the test is numeric.
#   * the NOT DONE record exercises lbstat / lbreasnd.
#
# Validate:
#   linkml-validate -s dta.linkml.yaml -C Transmission transmission.example.yaml
# ─────────────────────────────────────────────────────────────────────────────

