# ─────────────────────────────────────────────────────────────────────────────
# Mock Data Transfer AGREEMENT instance — validates against dta.linkml.yaml
# (root class: DataTransferAgreement).
#
# Exercises every agreement-layer class: Study/StudySummary, DtaVersion,
# BcSelection (+ faceted BcClassification incl. the is_used_by_dta edge), Party,
# TransferRequirements, VisitMapping, Source. Study context is an illustrative
# USDM projection; the model is study-agnostic.
#
# Validate:
#   linkml-validate -s dta.linkml.yaml -C DataTransferAgreement agreement.example.yaml
# ─────────────────────────────────────────────────────────────────────────────

app_name: dta_agreement_usdm_v1

source:
  usdm: anonymized USDM sample
  mvp: filtered MVP metadata
  template: "no template"

study:
  study_name: NCT01797120
  study_identifier: NCT01797120
  study_title: >-
    Study of Fulvestrant +/- Everolimus in Post-Menopausal, Hormone-Receptor +
    Metastatic Breast Ca Resistant to AI
  version_identifier: "1"
  version_id: StudyVersion_1
  design_id: InterventionalStudyDesign_1
  description: >-
    Post-menopausal women with HR+ metastatic breast cancer resistant to aromatase
    inhibitor therapy randomized to Fulvestrant with Everolimus or with placebo.
  summary:
    organizations: 3
    roles: 12
    assigned_persons: 9
    encounters: 8
    biomedical_concepts: 50
    bc_surrogates: 14

dta_version:
  version_number: "1.0"
  version_date: "2026-06-11"

data_types:
  - "Leukocyte Count (C51948)"
  - "Erythrocyte Count (C51946)"

data_type_details:
  - key: "C51948||Leukocyte Count"
    bc_id: C51948
    short_name: Leukocyte Count
    facets:
      - { group_name: category, value: "Hematology Tests" }
      - { group_name: category, value: "Complete Blood Count (CBC)" }
      - { group_name: disease_area, value: "Infection" }
      - { group_name: is_used_by_form, value: "EDC Form Local Lab - Hematology" }
      - { group_name: is_used_by_dta, value: "Data Transfer Agreement Central Lab" }
  - key: "C51946||Erythrocyte Count"
    bc_id: C51946
    short_name: Erythrocyte Count
    facets:
      - { group_name: category, value: "Blood Cell Counts" }
      - { group_name: category, value: "Complete Blood Count (CBC)" }
      - { group_name: is_used_by_dta, value: "Data Transfer Agreement Central Lab" }

parties:
  - id: StudyRole_1_Organization_1
    name: ""
    role: Clinical Study Sponsor
    organization: "PrECOG, LLC"
    organization_type: Clinical Study Sponsor
    data_exchange_role: Data Recipient
    email: ""
    signature_date: ""
    source: "USDM + UI"
  - id: StudyRole_11_Person_8
    name: Mary Smith
    role: Data Acquisition Lead
    organization: VendorLab1
    organization_type: Laboratory
    data_exchange_role: Data Provider
    email: ""
    signature_date: ""
    source: "USDM + UI"

transfer:
  file_name: Safety_Lab
  file_format: XPT
  encoding_system: UTF8
  delimiter: Not Applicable
  transmission_method: sFTP
  transmission_type: Cumulative
  transfer_environment: Production
  transfer_blinding: Blinded
  folder_name_provider: provider_out
  folder_name_recipient: sponsor_in

visit_mapping:
  - protocol_visit_number: "PRE-STUDY"
    protocol_visit_name: "Pre-Study"
    data_provider_visit_number: "01"
    data_provider_visit_name: "PRESTUDY"
    source: "USDM + UI"
  - protocol_visit_number: "C1D1"
    protocol_visit_name: "Cycle 1 Day 1"
    data_provider_visit_number: "02"
    data_provider_visit_name: "C1D1"
    source: "USDM + UI"

timepoint_mapping:
  - protocol_timepoint_number: "1"
    protocol_timepoint_name: "Pre-dose"
    data_provider_timepoint_number: "T1"
    data_provider_timepoint_name: "PREDOSE"
    source: UI

# ─────────────────────────────────────────────────────────────────────────────
# TEST SPECIFICATION (new in v0.2.0) — the agreed tests.
# Joined from the payload on (test_panel_name -> lbpanel,
# data_provider_test_code -> ctestcd), falling back to
# data_provider_test_name -> ctest where the vendor code is absent.
#
# Row 1 is the worked example from the DTA MVP Inventory's Test_Specification
# sheet verbatim. Rows 2-3 back the transmission.example.yaml payload. Row 4 shows a
# test identified by NAME ONLY — the flow-cytometry pattern, which is why the
# natural key needs a name fallback.
# ─────────────────────────────────────────────────────────────────────────────
test_specification:
  - test_panel_name: Blood Differential
    category: HEMATOLOGY
    bc_id: C51950
    data_provider_test_code: WBC
    data_provider_test_name: Leukocytes
    data_provider_test_description: Leukocytes in Blood
    test_name: Leukocytes
    test_code: "620043"
    method: HPLC
    specimen: BLOOD
    loinc_code: 26471-3
    data_type: numeric
    reported_unit: "10^9/L"
    conventional_unit: mcL
    si_unit: mm3
    blinding_flag: true
    agreement_status: Ordered

  - test_panel_name: HEMATOLOGY
    category: HEMATOLOGY
    bc_id: C64848
    data_provider_test_code: HGB
    data_provider_test_name: Hemoglobin
    test_name: Hemoglobin
    test_code: HGB
    method: HPLC
    specimen: BLOOD
    data_type: numeric
    reported_unit: g/dL
    conventional_unit: g/dL
    si_unit: g/L
    blinding_flag: false
    agreement_status: Final

  # Categorical test: data_type is what stops LBORRES "STRAW" being cast to LBSTRESN.
  - test_panel_name: URINALYSIS
    category: URINALYSIS
    bc_id: C51948
    data_provider_test_code: WBCU
    data_provider_test_name: Color Urine
    test_name: Color
    test_code: COLOR
    method: DIPSTICK
    specimen: URINE
    data_type: "<text 200>"
    result_values: CL_RESULT1
    blinding_flag: true
    agreement_status: Final

  # Identified by NAME only — no vendor test code (flow cytometry pattern).
  - test_panel_name: Revised T Cell Panel (V2_SP34-2)
    category: HEMATOLOGY
    bc_id: C51948
    data_provider_test_name: Naive_CD4_Th/CD3+
    test_name: Naive CD4 T Helper Cells
    test_code: CD4NAIVE
    method: FLOW CYTOMETRY
    specimen: Cryo PBMC
    data_type: numeric
    reported_unit: "%"
    blinding_flag: false
    agreement_status: Received

# ─────────────────────────────────────────────────────────────────────────────
# DATA STRUCTURE (new in v0.2.0) — the declared shape of the transferred file.
# Abridged: a representative sample of the 61 declared variables, chosen to cover
# each kind of column metadata (length, CT, core, mandatory, vendor naming).
# ─────────────────────────────────────────────────────────────────────────────
data_structure:
  dataset_name: LB
  dataset_description: Laboratory test results transfer dataset.
  variables:
    - variable_name: STUDYID
      variable_label: Study Identifier
      variable_description: Unique identifier for a study.
      variable_format: text
      variable_length: 40
      mandatory_variable_flag: true
      mandatory_value: true

    - variable_name: DOMAIN
      variable_label: Domain Abbreviation
      variable_description: Two-character abbreviation for the domain.
      variable_format: text
      variable_length: 2
      controlled_terminology: DOMAIN
      example_values: [LB, CP, MB]
      core_variable: Mandatory/Conditional
      mandatory_variable_flag: false
      mandatory_value: false

    - variable_name: LBORRES
      variable_label: Result or Finding in Original Units
      variable_description: Original result of the measurement or finding, as reported to the sites.
      variable_format: text
      variable_length: 200
      mandatory_variable_flag: true

    - variable_name: VISITNUM
      variable_label: Visit Number
      variable_description: Clinical encounter number. Numeric version of VISIT, used for sorting.
      variable_format: numeric
      variable_length: 8

    - variable_name: LBDTC
      variable_label: Date/Time of Specimen Collection
      variable_description: Specimen collection date or date and time, ISO 8601.
      variable_format: datetime
      variable_length: 19

    - variable_name: CTESTCD
      variable_label: External Vendor Test Code
      variable_description: Populated with the vendor internal test code.
      variable_format: text
      variable_length: 200
      vendor_variable_name: CTESTCD
      vendor_variable_label: Vendor Test Code
